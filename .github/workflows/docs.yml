name: Deploy docs

# GitHub Pages hosting requires GitHub's own Pages deploy action — see
# docs/specs/docs-site/spec.md.
#
# The build is driven directly (not via withastro/action) because the site
# builds through Bun's node-compat (bun x astro build), matching the local
# pipeline, and needs Playwright's Chromium for build-time mermaid-to-SVG
# rendering (rehype-mermaid, img-svg strategy).
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright Chromium (build-time mermaid rendering)
        run: bunx playwright install --with-deps chromium
        working-directory: site

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Build site
        run: bun x astro build
        working-directory: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
