name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun run check`'s secret-scan shells out to the gitleaks binary,
      # which GitHub runners don't preinstall — same install approach as
      # the Forgejo CI workflow that predated it.
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (secrets, types, lint, arch, tests)
        run: bun run check
